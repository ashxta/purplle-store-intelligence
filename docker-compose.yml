# docker-compose.yml
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - data:/data
      # Mount your CCTV footage here for pipeline access
      # - ./cctv_footage:/cctv_footage:ro
    environment:
      - DB_PATH=/data/store_intelligence.db
      - POS_CSV_PATH=/data/pos_transactions.csv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000
      - STORE_ID=STORE_BLR_002
    network_mode: host
    profiles:
      - dashboard
    restart: unless-stopped

volumes:
  data: